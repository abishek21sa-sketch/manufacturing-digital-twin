[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-digital-twin"
version = "1.0.0"
description = "Manufacturing digital twin decision intelligence platform with predictive risk, Gurobi scheduling, stochastic simulation, and future-state recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "numpy>=2.2,<2.5",
  "scipy>=1.15,<2",
  "scikit-learn>=1.8,<1.9",
  "joblib>=1.4,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
gurobi = ["gurobipy>=13.0,<14"]
gemini = ["google-genai>=2.18,<3"]

[project.scripts]
mdt = "mdt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
